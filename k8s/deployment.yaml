apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-mcp-server
  namespace: hospital-mcp
  labels:
    app: hospital-mcp-server
    version: "0.1.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hospital-mcp-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hospital-mcp-server
        version: "0.1.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: mcp-server
          image: hospital-mcp-server:0.1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hospital-mcp-config
            - secretRef:
                name: hospital-mcp-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: audit-logs
              mountPath: /app/audit_logs
      volumes:
        - name: audit-logs
          persistentVolumeClaim:
            claimName: hospital-mcp-audit-logs
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - hospital-mcp-server
                topologyKey: kubernetes.io/hostname
