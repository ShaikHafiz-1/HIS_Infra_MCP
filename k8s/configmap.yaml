apiVersion: v1
kind: ConfigMap
metadata:
  name: hospital-mcp-config
  namespace: hospital-mcp
  labels:
    app: hospital-mcp-server
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  DEBUG: "false"
  ENABLE_CACHING: "true"
  ENABLE_AUDIT_LOGGING: "true"
  ENABLE_HL7_INGESTION: "true"
  ENABLE_FHIR_INGESTION: "true"
  ENABLE_DICOM_INGESTION: "true"
  ENABLE_DEVICE_TELEMETRY: "true"
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8000"
  CORS_ORIGINS: '["https://clinical.hospital.internal"]'
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRATION_MINUTES: "480"
  HL7_LISTENER_HOST: "0.0.0.0"
  HL7_LISTENER_PORT: "2575"
  DICOM_LISTENER_HOST: "0.0.0.0"
  DICOM_LISTENER_PORT: "11112"
