version: "3.9"

# ─────────────────────────────────────────────────────────────────
# Hospital Clinical Intelligence MCP Platform — Docker Compose
# Services: Streamlit UI · FastAPI MCP Server · PostgreSQL/TimescaleDB
#           · Redis · (optional pgvector extension)
# ─────────────────────────────────────────────────────────────────

services:

  # ── Streamlit Enterprise UI ──────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: hci_ui
    ports:
      - "8501:8501"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./demo_audit_logs:/app/demo_audit_logs
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── FastAPI MCP Server ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: hci_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://hci:hci_pass@postgres:5432/hci_db
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-32-chars-min}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./demo_audit_logs:/app/demo_audit_logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── PostgreSQL + TimescaleDB ─────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: hci_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=hci
      - POSTGRES_PASSWORD=hci_pass
      - POSTGRES_DB=hci_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hci -d hci_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (session cache + rate limiter) ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hci_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: hci_network
